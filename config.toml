# TermLRC Settings File
# Changes saved to this file are automatically reloaded while TermLRC is running.
# Location priority:
#   1. --config <PATH> (or TERMLRC_CONFIG env var)
#   2. ./config.toml (current directory)
#   3. ~/.config/termlrc/config.toml

# Default folder to search recursively for .lrc files (can be overridden via CLI argument)
# lyrics_dir = "/mnt/Media/music"

# Preferred MPRIS media player name fragment (e.g., "spotify", "mpd", "vlc").
# Leave empty or commented out to automatically track the currently playing player.
player = ""

# -----------------------------------------------------------------------------
# Display & Fonts (Kitty Graphics Pixel-Scrolling Mode)
# -----------------------------------------------------------------------------

# Enable Kitty Graphics Protocol mode for true pixel-level smooth scrolling (toggle live with 'x')
kitty_graphics = true

# Primary font family name (e.g. "Noto Sans", "IBM Plex Sans JP", "Maple Mono NF", "DejaVu Sans")
# Matched case-insensitively against installed system fonts.
font_family = "Inter"

# Optional direct path to a custom .ttf, .otf, or .ttc font file (takes precedence over font_family)
font_path = ""

# Ordered list of fallback font families or file paths for CJK (Japanese/Chinese/Korean) and symbols
fallback_fonts = [
    "Noto Sans CJK",
    "IBM Plex Sans JP",
    "IBM Plex Sans SC",
    "IBM Plex Sans TC",
    "IBM Plex Sans KR",
    "WenQuanYi Zen Hei",
    "DejaVu Sans",
    "Unifont",
]

# Font size (in pixels) for the active focal lyric line in Kitty graphics mode
font_size_active = 25

# Font size (in pixels) for inactive lyric lines in Kitty graphics mode
font_size_inactive = 17.5

# Base vertical spacing (in pixels) between lyric lines in Kitty graphics mode
pixel_line_spacing = 25.0

# Guaranteed minimum vertical pixel gap between the active lyric's bounding box
# and adjacent non-active lyrics so they NEVER overlap regardless of font size or line wrapping
active_lyric_buffer_px = 18.0

# Guaranteed minimum vertical pixel gap between adjacent non-active lyric bounding boxes
inactive_lyric_buffer_px = 10.0

# -----------------------------------------------------------------------------
# Animation & Layout
# -----------------------------------------------------------------------------

# Target rendering and animation frame rate (15 - 240)
fps = 60

# Enable karaoke-style progressive highlight sweep across the active lyric line (toggle with 'k')
karaoke = false

# Scroll smoothness / spring damping speed:
# Lower values (e.g. 4.0 - 7.0) give a slower, softer glide.
# Higher values (e.g. 12.0 - 25.0) give a snappier transition.
scroll_speed = 10.0

# Continuously glide vertically across the duration of each lyric line
# instead of stepping smoothly when the next lyric line starts (toggle with 'g')
continuous_glide = false

# Vertical row spacing per lyric line for standard text TUI mode (1 = compact, 2 = double-spaced, up to 5)
line_spacing = 2

# Guaranteed minimum blank row buffer around the active lyric block in standard text TUI mode
active_lyric_buffer_rows = 1

# Global lyric timing offset in milliseconds (positive delays lyrics, negative advances them)
offset_ms = 0

# Horizontal lyric alignment: "center", "left", or "right"
alignment = "left"

# Dim inactive lyric lines
dim_inactive = true

# Only dim past (already sung) lyric lines while keeping upcoming lines at normal brightness
dim_past_only = false

# Optional marker shown around the active lyric line (e.g. "▸ " or "", leave empty for pure text)
active_marker = ""

# Symbol displayed on timestamped instrumental break lines (set to "" to leave blank)
empty_line_symbol = "♪"

# Symbol displayed when waiting for a song or when no matching .lrc is found (set to "" for blank)
idle_symbol = "♪"

# How often to poll D-Bus MPRIS for track/position updates in milliseconds (50 - 2000)
mpris_poll_ms = 250

# -----------------------------------------------------------------------------
# Local & Remote Fallback Lyric Matching
# -----------------------------------------------------------------------------

# Minimum confidence score (0.1 - 0.99) required to match a local .lrc file
match_threshold = 0.62

# Minimum confidence score (0.1 - 0.99) required to accept a remote fallback lyric match
fallback_match_threshold = 0.72

# Prioritise uncensored/explicit lyrics over censored ("f**k", "clean", "radio edit") versions
prefer_uncensored = true

# Clean up video-style metadata and identify canonical recording via Deezer and MusicBrainz
enable_metadata_identify = true

# Priority order of remote fallback providers when local .lrc search fails.
# Valid providers: "lrcmux", "lyricsplus", "lrclib", "kugou", "netease"
# Note: KuGou and NetEase are queried only when none of the earlier providers
# has synced lyrics timed for a recording of the playing length.
fallback_priority = ["lrcmux", "lyricsplus", "lrclib", "kugou", "netease"]

# Individual toggles for each remote fallback provider
enable_lrcmux = true
enable_lyricsplus = true
enable_lrclib = true
enable_kugou = true
enable_netease = true

# Optional custom base URLs for self-hosted lrcmux or LyricsPlus instances
lrcmux_api_url = ""
lyricsplus_api_url = ""
